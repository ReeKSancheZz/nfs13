name: Windows x64 build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "windows-build/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Prepare server for a standalone Windows build
        run: python windows-build/prepare_server.py

      - name: Build patcher executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name NFS13-Patcher
          --add-data "client/patches/nfs13_online.json;patches"
          client/patch_nfs13.py

      - name: Build server executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name NFS13-Server
          build/server/server_windows.py

      - name: Assemble Windows x64 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/NFS13-Patcher.exe package/
          Copy-Item dist/NFS13-Server.exe package/
          Copy-Item windows-build/run_server.bat package/
          @'
          NFS13 Windows x64 executables

          NFS13-Patcher.exe patches a legally acquired Need for Speed: Most Wanted (2012) installation.
          NFS13-Server.exe runs the Python game server.

          IMPORTANT: This package does NOT include the SSLv3 frontend required by the game.
          The repository currently provides that frontend as a Linux Docker build. The EXEs
          alone are therefore not a complete, ready-to-host Windows server.

          Set NFS13_HOST to the server's reachable IP address before launching the server.
          Persistent player data is stored beside NFS13-Server.exe.
          '@ | Set-Content -Encoding UTF8 package/README-Windows.txt

      - name: Upload Windows x64 executables
        uses: actions/upload-artifact@v4
        with:
          name: nfs13-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 30
