name: Build Case Zero XEX image dumper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-casezero-dumper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out Case Zero source
        uses: actions/checkout@v4
        with:
          repository: wivi514/Dead_Rising_2_Case_Zero_Xenon_Recomp
          ref: master
          path: CaseZero

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure LLVM and Ninja are available
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          clang-cl --version
          cmake --version
          ninja --version

      - name: Check out the matching XenonRecomp and apply Case Zero's decoder fixes
        shell: pwsh
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git ..\XenonRecomp
          git -C ..\XenonRecomp checkout ddd128bcca99fe8bfbb99bea583c972351fa6ace
          git -C ..\XenonRecomp submodule update --init --recursive
          git -C ..\XenonRecomp apply "$env:GITHUB_WORKSPACE\CaseZero\tools\ci\xenonrecomp-local.patch"

      - name: Build XenonUtils and its required libraries
        shell: pwsh
        run: |
          cmake -S ..\XenonRecomp -B ..\XenonRecomp\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ..\XenonRecomp\build --target XenonUtils fmt xxhash --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile xex_image_dump.exe
        shell: pwsh
        run: |
          $root = (Resolve-Path ..\XenonRecomp).Path
          $build = Join-Path $root "build"
          $utils = Join-Path $build "XenonUtils\XenonUtils.lib"
          $disasm = Join-Path $build "thirdparty\disasm\disasm.lib"
          $fmt = Join-Path $build "thirdparty\fmt\fmt.lib"
          foreach ($lib in @($utils, $disasm, $fmt)) {
            if (-not (Test-Path $lib)) {
              Write-Host "Expected library not found: $lib"
              Get-ChildItem $build -Recurse -Filter *.lib | Select-Object -ExpandProperty FullName
              exit 1
            }
          }
          clang-cl /nologo /O2 /std:c++20 /EHsc /I"$root\XenonUtils" /I"$root\thirdparty\simde" /I"$root\thirdparty\fmt\include" "$env:GITHUB_WORKSPACE\CaseZero\tools\xex_image_dump.cpp" "$utils" "$disasm" "$fmt" /Fe:"$env:GITHUB_WORKSPACE\xex_image_dump.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE\xex_image_dump.exe" 2>&1
          if ($LASTEXITCODE -ne 1) { throw "The dumper did not return its expected usage response." }

      - name: Upload Windows extraction utility
        uses: actions/upload-artifact@v4
        with:
          name: xex-image-dump-windows-x64
          path: xex_image_dump.exe
          if-no-files-found: error
          retention-days: 7
